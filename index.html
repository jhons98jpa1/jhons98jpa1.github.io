<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>De Jhonatan para Alison Michell</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  padding:0;
  background:black;
  overflow:hidden;
}

canvas{
  position:fixed;
  top:0;
  left:0;
}

#mainText{
  position:absolute;
  top:40%;
  width:100%;
  transform:translateY(-50%);
  text-align:center;
  font-family:'Great Vibes', cursive;
  color:#ffd1ec;
  font-size:44px;
  text-shadow:0 0 12px pink, 0 0 25px hotpink;
  display:none;
  z-index:10;
}

#hint{
  position:absolute;
  bottom:25px;
  width:100%;
  text-align:center;
  font-family:'Dancing Script', cursive;
  color:#aaa;
  font-size:16px;
  z-index:10;
}

#musicBtn{
  position:absolute;
  bottom:25px;
  width:100%;
  text-align:center;
  font-family:'Dancing Script', cursive;
  color:#fff;
  font-size:18px;
  z-index:10;
  display:none;
  cursor:pointer;
}

.floating{
  position:absolute;
  font-family:'Dancing Script', cursive;
  color:#ffe4f3;
  font-size:15px;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="mainText">De Jhonatan para Alison Michell</div>
<div id="hint">Toca la pantalla</div>
<div id="musicBtn">▶️ Reproducir música</div>

<canvas id="c"></canvas>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_6e6d7f3c3f.mp3">
</audio>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
function resize(){
  c.width=innerWidth;
  c.height=innerHeight;
}
resize();
onresize=resize;

/* GALAXIA */
let stars=[];
for(let i=0;i<350;i++){
  stars.push({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    s:Math.random()*1.2+0.3
  });
}

/* CORAZÓN */
function heart(t){
  return{
    x:16*Math.pow(Math.sin(t),3),
    y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
  };
}

let particles=[];
function createBigHeart(){
  particles=[];
  let cx=c.width/2;
  let cy=c.height/2+40;
  let scale=18;
  for(let t=0;t<Math.PI*2;t+=0.04){
    let p=heart(t);
    particles.push({
      x:cx+p.x*scale,
      y:cy+p.y*scale,
      vx:(Math.random()-0.5)*0.25,
      vy:(Math.random()-0.5)*0.25
    });
  }
}

/* FRASES */
const phrases=[
  "Te quiero mucho",
  "Gracias por compartir",
  "Cada día un poco de tu alegría",
  "Gracias por sacarme una sonrisa",
  "Gracias por habernos conocido",
  "Y otras palabras más diría",
  "Pero jejee",
  "Algún día quizá jajaa",
  "Espero te guste esto",
  "Tardé toda la mañana tratando de hacer que quede bien",
  "Algo menos para que salga",
  "No salió como quería",
  "Algo es algo",
  "Y gracias por leer"
];

let phraseIndex=0;
function showPhrase(){
  if(phraseIndex>=phrases.length) return;
  let d=document.createElement("div");
  d.className="floating";
  d.innerText=phrases[phraseIndex];
  d.style.left=Math.random()*innerWidth+"px";
  d.style.top=innerHeight+"px";
  document.body.appendChild(d);

  let y=innerHeight;
  function move(){
    y-=0.4;
    d.style.top=y+"px";
    if(y<-70){ d.remove(); }
    else{ requestAnimationFrame(move); }
  }
  move();
  phraseIndex++;
}

/* SECUENCIA */
let step=0;
document.body.addEventListener("click",()=>{
  step++;

  if(step===1){
    mainText.style.display="block";
  }
  else if(step===2){
    createBigHeart();
  }
  else if(step===3){
    hint.style.display="none";
    musicBtn.style.display="block";
  }
  else{
    showPhrase();
  }
});

/* BOTÓN DE MÚSICA (OBLIGATORIO PARA iPHONE) */
musicBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  document.getElementById("music").play();
  musicBtn.innerText="🎵 Música reproduciéndose";
});

/* ANIMACIÓN */
function animate(){
  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,1,1);
    s.y+=s.s*0.12;
    if(s.y>c.height) s.y=0;
  });

  ctx.fillStyle="hotpink";
  particles.forEach(p=>{
    ctx.fillRect(p.x,p.y,2,2);
    p.x+=p.vx;
    p.y+=p.vy;
  });

  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
