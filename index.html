<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>De Jhonatan para Alison Michell</title>

<!-- FUENTES ELEGANTES -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  padding:0;
  background:black;
  overflow:hidden;
}

/* CANVAS */
canvas{
  position:fixed;
  top:0;
  left:0;
}

/* TEXTO PRINCIPAL */
#mainText{
  position:absolute;
  top:42%;
  width:100%;
  transform:translateY(-50%);
  text-align:center;
  font-family:'Great Vibes', cursive;
  color:#ffd1ec;
  font-size:44px;
  letter-spacing:2px;
  text-shadow:0 0 12px pink, 0 0 25px hotpink;
  z-index:10;
}

/* TEXTOS FLOTANTES */
.floating{
  position:absolute;
  font-family:'Dancing Script', cursive;
  color:#ffe4f3;
  font-size:16px;
  opacity:0.95;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="mainText">De Jhonatan para Alison Michell</div>
<canvas id="c"></canvas>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_6e6d7f3c3f.mp3">
</audio>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
function resize(){
  c.width=innerWidth;
  c.height=innerHeight;
}
resize();
onresize=resize;

/* GALAXIA */
let stars=[];
for(let i=0;i<450;i++){
  stars.push({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    s:Math.random()*1.4+0.3
  });
}

/* FORMA DEL CORAZÓN */
function heart(t){
  return{
    x:16*Math.pow(Math.sin(t),3),
    y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
  };
}

/* PARTÍCULAS */
let particles=[];
function spawnHeart(cx,cy,scale){
  for(let t=0;t<Math.PI*2;t+=0.05){
    let p=heart(t);
    particles.push({
      x:cx+p.x*scale,
      y:cy+p.y*scale,
      vx:(Math.random()-0.5)*0.35,
      vy:(Math.random()-0.5)*0.35
    });
  }
}

/* CREAR CORAZONES */
function createHearts(){
  particles=[];
  let mx=c.width/2;
  let my=c.height/2;
  for(let i=-2;i<=2;i++){
    spawnHeart(mx+i*160,my-150,8);
  }
  spawnHeart(mx,my+160,12);
}
createHearts();

/* FRASES FLOTANTES */
const phrases=[
  "Te quiero mucho",
  "Gracias por compartir",
  "Cada día un poco de tu alegría",
  "Gracias por sacarme una sonrisa",
  "Gracias por habernos conocido",
  "Y otras palabras más diría",
  "Pero jejee",
  "Algún día quizá jajaa",
  "Espero te guste esto",
  "Tardé toda la mañana tratando de hacer que quede bien",
  "Algo menos para que salga",
  "No salió como quería",
  "Algo es algo",
  "Y gracias por leer"
];

function floatingText(){
  let d=document.createElement("div");
  d.className="floating";
  d.innerText=phrases[Math.floor(Math.random()*phrases.length)];
  d.style.left=Math.random()*innerWidth+"px";
  d.style.top=innerHeight+"px";
  document.body.appendChild(d);

  let y=innerHeight;
  let speed=Math.random()*0.5+0.3;

  function move(){
    y-=speed;
    d.style.top=y+"px";
    if(y<-60){
      d.remove();
    }else{
      requestAnimationFrame(move);
    }
  }
  move();
}
setInterval(floatingText,850);

/* ANIMACIÓN */
function animate(){
  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,1,1);
    s.y+=s.s*0.15;
    if(s.y>c.height) s.y=0;
  });

  ctx.fillStyle="hotpink";
  particles.forEach(p=>{
    ctx.fillRect(p.x,p.y,2,2);
    p.x+=p.vx;
    p.y+=p.vy;
  });

  requestAnimationFrame(animate);
}
animate();

/* MÚSICA */
document.body.addEventListener("click",()=>{
  document.getElementById("music").play();
});
</script>

</body>
</html>
