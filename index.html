<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Jhonatan ❤️ Alisson Michell</title>
<style>
html,body{
  margin:0;
  padding:0;
  background:black;
  overflow:hidden;
  font-family: Arial, sans-serif;
}
canvas{
  position:fixed;
  top:0;
  left:0;
}
#title{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
  color:#ffb6ff;
  font-size:22px;
  letter-spacing:2px;
  text-shadow:0 0 10px pink;
}
</style>
</head>
<body>

<div id="title">Te Amo Muchote 💖</div>
<canvas id="c"></canvas>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2022/03/09/audio_1e6d6a2f98.mp3">
</audio>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

window.onresize = ()=>{
  canvas.width = innerWidth;
  canvas.height = innerHeight;
};

let stars=[];
let particles=[];

// ⭐ estrellas
for(let i=0;i<400;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    s:Math.random()*1.5+0.3
  });
}

// 💗 función corazón
function heart(t){
  return {
    x:16*Math.pow(Math.sin(t),3),
    y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
  };
}

// 💞 crear corazones grandes
function createHeart(cx,cy,scale){
  for(let t=0;t<Math.PI*2;t+=0.08){
    let p=heart(t);
    particles.push({
      x:cx+p.x*scale,
      y:cy+p.y*scale,
      vx:(Math.random()-0.5)*0.3,
      vy:(Math.random()-0.5)*0.3,
      a:1
    });
  }
}

// 💗 fila de corazones
let yBase = canvas.height/2;
for(let i=-2;i<=2;i++){
  createHeart(canvas.width/2 + i*180, yBase-120, 10);
}
createHeart(canvas.width/2, yBase+120, 16);

// ✨ animación
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // estrellas
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,1,1);
    s.y+=s.s*0.15;
    if(s.y>canvas.height) s.y=0;
  });

  // partículas corazón
  ctx.fillStyle="hotpink";
  particles.forEach(p=>{
    ctx.globalAlpha=p.a;
    ctx.fillRect(p.x,p.y,2,2);
    p.x+=p.vx;
    p.y+=p.vy;
  });

  ctx.globalAlpha=1;
  requestAnimationFrame(animate);
}
animate();

// 🎵 música al tocar
document.body.addEventListener("click",()=>{
  document.getElementById("music").play();
});
</script>

</body>
</html>
